<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clima</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#191919; --ink:#ebe6dc; --dim:#8f8a82; --line:#2f2f2f; }
  @media (prefers-color-scheme: light) { :root { --bg:#ffffff; --ink:#1f1f1f; --dim:#787774; --line:#e9e9e7; } }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; display:flex; flex-direction:column; justify-content:center; padding:8px 4px; overflow:hidden; }
  .city { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); }
  .now { display:flex; align-items:center; gap:12px; margin-top:4px; }
  .temp { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:64px; line-height:.9; font-variant-numeric:lining-nums; }
  .ico { font-size:30px; }
  .desc { font-size:13px; }
  .sub { font-size:11px; color:var(--dim); margin-top:2px; }
  .days { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); text-align:center; }
  .d { font-size:11px; color:var(--dim); text-transform:capitalize; }
  .d b { display:block; font-size:16px; margin:3px 0; font-weight:400; }
  .d span { color:var(--ink); }
  .msg { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
  <div id="app"><div class="msg">Carregando clima…</div></div>
<script>
  const WMO = {
    0: ["☀️", "Céu limpo"], 1: ["🌤️", "Poucas nuvens"], 2: ["⛅", "Parcialmente nublado"], 3: ["☁️", "Nublado"],
    45: ["🌫️", "Neblina"], 48: ["🌫️", "Neblina"], 51: ["🌦️", "Garoa fraca"], 53: ["🌦️", "Garoa"], 55: ["🌦️", "Garoa forte"],
    61: ["🌧️", "Chuva fraca"], 63: ["🌧️", "Chuva"], 65: ["🌧️", "Chuva forte"], 66: ["🌧️", "Chuva gelada"], 67: ["🌧️", "Chuva gelada"],
    71: ["🌨️", "Neve fraca"], 73: ["🌨️", "Neve"], 75: ["🌨️", "Neve forte"], 80: ["🌦️", "Pancadas fracas"], 81: ["🌧️", "Pancadas"],
    82: ["⛈️", "Pancadas fortes"], 95: ["⛈️", "Trovoadas"], 96: ["⛈️", "Trovoadas c/ granizo"], 99: ["⛈️", "Trovoadas c/ granizo"],
  };
  const w = c => WMO[c] || ["🌡️", "—"];
  async function local() {
    try {
      const r = await fetch("https://get.geojs.io/v1/ip/geo.json");
      const j = await r.json();
      return { lat: +j.latitude, lon: +j.longitude, city: j.city || j.region || "" };
    } catch (e) {
      return { lat: -23.55, lon: -46.63, city: "São Paulo" };
    }
  }
  async function load() {
    const app = document.getElementById("app");
    try {
      const p = await local();
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}` +
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
      const j = await (await fetch(url)).json();
      const c = j.current, [ico, desc] = w(c.weather_code);
      const days = j.daily.time.map((t, i) => {
        const wd = i === 0 ? "hoje" : new Date(t + "T12:00").toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
        return `<div class="d">${wd}<b>${w(j.daily.weather_code[i])[0]}</b><span>${Math.round(j.daily.temperature_2m_max[i])}°</span> ${Math.round(j.daily.temperature_2m_min[i])}°</div>`;
      }).join("");
      app.innerHTML = `
        <div class="city">${p.city}</div>
        <div class="now"><div class="temp">${Math.round(c.temperature_2m)}°</div>
          <div><div class="ico">${ico}</div></div>
          <div><div class="desc">${desc}</div><div class="sub">Sensação ${Math.round(c.apparent_temperature)}° · Umidade ${c.relative_humidity_2m}%</div></div>
        </div>
        <div class="days">${days}</div>`;
    } catch (e) {
      app.innerHTML = '<div class="msg">Não consegui carregar o clima agora.</div>';
    }
  }
  load(); setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
