<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu dia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#191919; --card:#202020; --ink:#ebebeb; --dim:#9b9b9b; --line:#2f2f2f; --acc:#d9b26f; }
  @media (prefers-color-scheme: light) { :root { --bg:#ffffff; --card:#f7f7f5; --ink:#1f1f1f; --dim:#787774; --line:#e9e9e7; --acc:#9a6b1f; } }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden; padding:4px 2px; }
  .hdr { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:8px; }
  .hdr h1 { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:24px; }
  .hdr span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  #app { flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .sec { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:10px 0 6px; }
  .sec:first-child { margin-top:0; }
  a.ev { display:flex; gap:10px; padding:8px 10px; margin-bottom:6px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c, var(--acc)); border-radius:6px; color:inherit; text-decoration:none; }
  a.ev.past { opacity:.45; }
  a.ev.now { border-color:var(--acc); }
  .t { font-size:12px; font-variant-numeric:tabular-nums; color:var(--dim); min-width:44px; padding-top:1px; }
  .t b { display:block; color:var(--ink); font-weight:600; font-size:13px; }
  .tt { font-size:13px; font-weight:600; line-height:1.3; }
  .sub { font-size:11px; color:var(--dim); margin-top:2px; }
  .badge { display:inline-block; font-size:10px; font-weight:600; color:#191919; background:var(--acc); border-radius:3px; padding:1px 5px; margin-left:6px; vertical-align:1px; }
  .free { color:var(--dim); font-size:13px; padding:6px 0; }
  .connect { padding:10px 0; font-size:13px; color:var(--dim); }
  .connect button { margin-top:10px; font:inherit; font-weight:600; color:#191919; background:var(--acc); border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
  .msg { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
  <div class="hdr"><h1>Meu dia</h1><span id="hoje"></span></div>
  <div id="app"><div class="msg">Carregando…</div></div>
<script src="google-auth.js"></script>
<script>
  const app = document.getElementById("app");
  const pad = n => String(n).padStart(2, "0");
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("hoje").textContent =
    new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" }).replace(".", "");

  function rel(ms) {
    const m = Math.round(ms / 6e4);
    if (m < 60) return `em ${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `em ${h}h${pad(r)}` : `em ${h}h`;
  }

  async function events(from, to) {
    const cals = await qgApi("https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader");
    const ativos = cals.items.filter(c => c.selected !== false);
    const lists = await Promise.all(ativos.map(c =>
      qgApi(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime` +
        `&timeMin=${from.toISOString()}&timeMax=${to.toISOString()}`)
        .then(r => r.items.map(e => ({ ...e, cor: c.backgroundColor })))
        .catch(() => [])
    ));
    return lists.flat()
      .filter(e => e.status !== "cancelled")
      .map(e => ({
        titulo: e.summary || "(sem título)", local: e.location, link: e.htmlLink, cor: e.cor,
        diaInteiro: !!e.start.date,
        ini: new Date(e.start.dateTime || e.start.date + "T00:00"),
        fim: new Date(e.end.dateTime || e.end.date + "T00:00"),
      }))
      .sort((a, b) => a.ini - b.ini);
  }

  function card(e, agora) {
    const passou = !e.diaInteiro && e.fim < agora;
    const rolando = !e.diaInteiro && e.ini <= agora && e.fim > agora;
    const prox = !e.diaInteiro && e.ini > agora && e.ini - agora < 3 * 3600e3;
    const t = e.diaInteiro ? `<div class="t"><b>Dia</b>todo</div>` : `<div class="t"><b>${hm(e.ini)}</b>${hm(e.fim)}</div>`;
    const badge = rolando ? '<span class="badge">agora</span>' : prox ? `<span class="badge">${rel(e.ini - agora)}</span>` : "";
    return `<a class="ev${passou ? " past" : ""}${rolando ? " now" : ""}" href="${esc(e.link)}" target="_blank" rel="noopener" style="--c:${esc(e.cor)}">
      ${t}<div><div class="tt">${esc(e.titulo)}${badge}</div>${e.local ? `<div class="sub">${esc(e.local)}</div>` : ""}</div></a>`;
  }

  async function load() {
    const agora = new Date();
    const ini = new Date(agora); ini.setHours(0, 0, 0, 0);
    const amanha = new Date(ini); amanha.setDate(ini.getDate() + 1);
    const depois = new Date(ini); depois.setDate(ini.getDate() + 2);
    const evs = await events(ini, depois);
    const hoje = evs.filter(e => e.ini < amanha && e.fim > ini);
    const am = evs.filter(e => e.ini >= amanha);
    const restantes = hoje.filter(e => e.diaInteiro || e.fim > agora).length;
    let html = `<div class="sec">Hoje · ${restantes} ${restantes === 1 ? "evento restante" : "eventos restantes"}</div>`;
    html += hoje.length ? hoje.map(e => card(e, agora)).join("") : `<div class="free">Nada marcado hoje. Dia livre.</div>`;
    if (am.length) html += `<div class="sec">Amanhã</div>` + am.slice(0, 4).map(e => card(e, agora)).join("");
    app.innerHTML = html;
  }

  qgMount({ el: app, load, every: 5 * 60 * 1000 });
</script>
</body>
</html>
